    <script>
      (function() {
        function isExtensionError(msg, src) {
          var m = (String(msg || '')).toLowerCase();
          var s = (String(src || '')).toLowerCase();
          return (
            m.indexOf('metamask') !== -1 ||
            s.indexOf('metamask') !== -1 ||
            m.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('chrome-extension://') !== -1 ||
            m.indexOf('moz-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event ? (event.reason || event) : null;
          var msg = typeof reason === 'string' ? reason : (reason && (reason.message || reason.stack)) || '';
          var stack = (reason && reason.stack) || '';
          if (isExtensionError(msg, stack)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event ? (event.message || (event.error && (event.error.message || event.error.stack))) : '';
          var src = event ? (event.filename || (event.error && event.error.stack) || '') : '';
          if (isExtensionError(msg, src)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
